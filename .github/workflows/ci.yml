name: CI

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Dummy values for Settings construction at test-collection time.
      # Unit tests are hermetic (fake providers) — nothing dials out.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/rag_recipes
      REDIS_URL: redis://:redis@localhost:6379/0
      OPENAI_API_KEY: sk-ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check src/ tests/ evals/
      - name: Mypy
        run: uv run mypy src/ evals/
      - name: Unit tests
        run: uv run pytest tests/unit -q
