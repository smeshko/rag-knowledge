<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- {{TITLE}} : the browser tab title -->
<title>{{TITLE}}</title>
<!-- set theme before first paint; prefer a #t=light|dark hint from a parent frame, else stored pref -->
<script>(function(){try{var h=(location.hash.match(/[#&]t=(light|dark)/)||[])[1];var p=h||localStorage.getItem("md-viewer-theme")||"system";var light=p==="light"||(p==="system"&&window.matchMedia("(prefers-color-scheme: light)").matches);document.documentElement.setAttribute("data-theme",light?"light":"dark");}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ── Theme tokens — override this block to re-skin the whole doc ── */
:root{
  --bg:#0a0e13; --panel:#0f151d; --panel-2:#131c26; --panel-3:#172230;
  --line:#1e2a37; --line-bright:#2c3d4f;
  --ink:#dce5ef; --ink-dim:#8a98a9; --ink-faint:#566372;
  --green:#3ad6a0; --amber:#f3b54a; --red:#ef6d6d;
  --blue:#5fa8e0; --violet:#b08cf0; --steel:#85aacb;
  --grid:rgba(120,160,200,.045);
  --f-disp:'Archivo',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  --sidebar:288px;
}
/* ── Light theme — applied when <html data-theme="light"> (set by the toggle / system pref) ── */
:root[data-theme="light"]{
  --bg:#f3f6f9; --panel:#ffffff; --panel-2:#eaf0f5; --panel-3:#dde6ee;
  --line:#d6dee7; --line-bright:#bcc8d4;
  --ink:#1a2430; --ink-dim:#55657a; --ink-faint:#8593a4;
  --green:#0e9d6e; --amber:#bf7d12; --red:#d2433f;
  --blue:#2f7ec4; --violet:#7a4fd0; --steel:#48657f;
  --grid:rgba(40,80,130,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:30px 30px;
  color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased; display:flex; min-height:100%;
}
a{color:var(--green);text-decoration:none}
a:hover{text-decoration:underline}
code,.mono{font-family:var(--f-mono)}
em{color:var(--ink-dim);font-style:normal}
strong,b{font-weight:600}
img{max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line);margin:6px 0}

/* ── Sidebar ─────────────────────────────────────────── */
aside{
  width:var(--sidebar); flex:0 0 var(--sidebar); position:sticky; top:0; height:100vh;
  border-right:1px solid var(--line); background:linear-gradient(180deg,var(--panel),var(--bg));
  display:flex; flex-direction:column; padding:22px 18px; gap:16px; z-index:5;
}
.brand{display:flex;flex-direction:column;gap:3px}
.brand .kick{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--green)}
.brand h1{font-family:var(--f-disp);font-weight:900;font-size:20px;letter-spacing:-.01em;margin:0;line-height:1.05}
.brand .sub{font-size:11.5px;color:var(--ink-faint);font-family:var(--f-mono)}

/* doc switcher (only shown when >1 doc is embedded); caps its height so the
   section nav below always keeps room — both scroll independently if long */
.docs{display:none;flex-direction:column;gap:3px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin:0 -6px;max-height:38vh;overflow-y:auto;flex:0 0 auto}
.docs.show{display:flex}
.docs .dl{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);padding:0 12px 6px;position:sticky;top:0;background:var(--panel)}
.navlabel{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);padding:2px 12px 4px;display:none}
.navlabel.show{display:block}
.docbtn{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:9px;padding:7px 12px;border-radius:7px;color:var(--ink-dim);transition:.14s}
.docbtn .dn{font-family:var(--f-mono);font-size:10px;color:var(--ink-faint);min-width:16px}
.docbtn .dt{font-size:13px;font-weight:500;line-height:1.2}
.docbtn:hover{background:var(--panel-2);color:var(--ink)}
.docbtn.active{background:var(--panel-3);color:var(--ink)}
.docbtn.active .dn{color:var(--green)}
.docbtn .dcc{margin-left:auto;font-family:var(--f-mono);font-size:9.5px;background:var(--amber);color:#1a1206;border-radius:10px;padding:1px 6px;font-weight:700;display:none}
.docbtn .dcc.show{display:inline-block}

nav{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1;margin:0 -6px;padding:0 6px}
nav button{
  all:unset; cursor:pointer; display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:7px;
  color:var(--ink-dim); font-size:13.5px; transition:.14s;
}
nav button .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-faint);min-width:18px}
nav button .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button:hover{background:var(--panel-2);color:var(--ink)}
nav button.active{background:var(--panel-3);color:var(--ink)}
nav button.active .n{color:var(--green)}
nav button .cc{margin-left:auto;font-family:var(--f-mono);font-size:10px;background:var(--amber);color:#1a1206;border-radius:10px;padding:1px 6px;font-weight:700;display:none}
nav button .cc.show{display:inline-block}

.tools{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:9px}
.tbtn{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.02em;
  border:1px solid var(--line-bright);border-radius:7px;padding:8px 10px;color:var(--ink-dim);transition:.14s;display:flex;align-items:center;gap:8px}
.tbtn:hover{border-color:var(--green);color:var(--ink)}
.tbtn.on{background:var(--green);color:#04130d;border-color:var(--green);font-weight:700}
.tbtn .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.6}
.tools .row{display:flex;gap:8px}
.tools .row .tbtn{flex:1;justify-content:center}
.tools .hint{font-size:10.5px;color:var(--ink-faint);line-height:1.45;font-family:var(--f-mono)}
.tools .hint b{color:var(--ink-dim);font-weight:500}
.tools .hint.keys b{color:var(--green);font-weight:700}
.seg{display:flex;border:1px solid var(--line-bright);border-radius:7px;overflow:hidden}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:7px 4px;
  font-family:var(--f-mono);font-size:11px;letter-spacing:.02em;color:var(--ink-dim);transition:.14s}
.seg button + button{border-left:1px solid var(--line-bright)}
.seg button:hover{background:var(--panel-2);color:var(--ink)}
.seg button.on{background:var(--green);color:#04130d;font-weight:700}

/* ── Main ────────────────────────────────────────────── */
main{flex:1;min-width:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow:auto;scroll-behavior:smooth}
.section{display:none;max-width:980px;margin:0 auto;padding:46px 54px 90px}
.section.active{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.shead{display:flex;align-items:flex-start;gap:20px;margin-bottom:34px;border-bottom:1px solid var(--line);padding-bottom:22px}
.shead .idx{font-family:var(--f-disp);font-weight:900;font-size:58px;line-height:.8;color:var(--panel-3);-webkit-text-stroke:1px var(--line-bright);letter-spacing:-.03em}
.shead .meta{padding-top:4px;min-width:0}
.shead .kick{font-family:var(--f-mono);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--green);margin-bottom:7px}
.shead h2{font-family:var(--f-disp);font-weight:800;font-size:30px;margin:0 0 6px;letter-spacing:-.02em;line-height:1.1}
.shead p{margin:0;color:var(--ink-dim);font-size:14.5px;max-width:62ch}

h3{font-family:var(--f-disp);font-weight:700;font-size:15px;letter-spacing:.01em;margin:30px 0 13px;color:var(--ink);
  display:flex;align-items:center;gap:10px}
h3::before{content:"";width:9px;height:9px;background:var(--green);border-radius:2px;transform:rotate(45deg);flex:0 0 auto}
h4{font-family:var(--f-disp);font-weight:700;font-size:13px;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-dim);margin:22px 0 10px}
.commentable > h3:first-child,.commentable > h4:first-child,.section > .commentable:first-of-type h3:first-child{margin-top:0}
p{margin:0 0 13px}
p.lede{color:var(--ink-dim);font-size:14px;margin:0 0 8px}

/* commentable wrap */
.commentable{position:relative;margin:0 0 10px;border-radius:9px;padding:4px;transition:.15s}
body.comments-on .commentable{outline:1px dashed var(--line-bright);outline-offset:2px}
body.comments-on .commentable:hover{outline-color:var(--amber)}
.cmt-add{all:unset;cursor:pointer;position:absolute;top:6px;right:6px;z-index:3;display:none;
  font-family:var(--f-mono);font-size:10.5px;color:#1a1206;background:var(--amber);padding:3px 9px;border-radius:20px;font-weight:700}
body.comments-on .commentable:hover > .cmt-add{display:inline-block}
.cmt-badge{position:absolute;top:8px;right:8px;z-index:2;font-family:var(--f-mono);font-size:10px;font-weight:700;
  background:var(--amber);color:#1a1206;border-radius:20px;padding:2px 7px;display:none}
.commentable.has-notes > .cmt-badge{display:inline-block}
body.comments-on .commentable.has-notes:hover > .cmt-badge{display:none}

.cmt-zone{margin:8px 4px 2px;display:flex;flex-direction:column;gap:7px}
.cmt-note{background:rgba(243,181,74,.08);border:1px solid rgba(243,181,74,.32);border-left:3px solid var(--amber);
  border-radius:6px;padding:8px 11px;font-size:13px;color:var(--ink);display:flex;gap:10px;align-items:flex-start}
.cmt-note .tx{flex:1;white-space:pre-wrap;word-break:break-word}
.cmt-note .tm{font-family:var(--f-mono);font-size:9.5px;color:var(--ink-faint);white-space:nowrap}
.cmt-note .del{all:unset;cursor:pointer;color:var(--ink-faint);font-size:13px;line-height:1;display:none}
body.comments-on .cmt-note .del{display:inline}
.cmt-note .del:hover{color:var(--red)}
.cmt-edit{display:flex;flex-direction:column;gap:7px;background:var(--panel-2);border:1px solid var(--line-bright);border-radius:7px;padding:9px}
.cmt-edit textarea{width:100%;min-height:64px;resize:vertical;background:var(--bg);border:1px solid var(--line-bright);
  border-radius:5px;color:var(--ink);font-family:var(--f-body);font-size:13px;padding:8px;outline:none}
.cmt-edit textarea:focus{border-color:var(--amber)}
.cmt-edit .ebtns{display:flex;gap:8px;justify-content:flex-end}
.cmt-edit .ebtns button{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:11px;padding:5px 12px;border-radius:5px}
.cmt-edit .save{background:var(--amber);color:#1a1206;font-weight:700}
.cmt-edit .cancel{color:var(--ink-dim);border:1px solid var(--line-bright)}

/* ── content primitives (auto-rendered + available for hand-polish) ── */
.tbl-scroll{overflow-x:auto;margin:4px 0;border-radius:8px}
table{border-collapse:collapse;font-size:13px;width:auto;min-width:100%}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;word-break:normal;overflow-wrap:normal}
td{max-width:48ch}
th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:500;white-space:nowrap}
td:first-child{color:var(--ink)}
tr:hover td{background:var(--panel)}
td code,td .mono{color:var(--green);font-size:12px}
.tag{font-family:var(--f-mono);font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.04em;white-space:nowrap}
.tag.keep{background:rgba(58,214,160,.14);color:var(--green)}
.tag.swap{background:rgba(243,181,74,.15);color:var(--amber)}
.tag.drop{background:rgba(239,109,109,.15);color:var(--red)}
.tag.opt{background:rgba(95,168,224,.15);color:var(--blue)}
.tag.code{background:rgba(133,170,203,.16);color:var(--steel)}
.tag.llm{background:rgba(176,140,240,.18);color:var(--violet)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:11px;margin:6px 0}
.card2{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px 15px}
.card2 .lab{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px}
.card2 .big{font-family:var(--f-disp);font-weight:800;font-size:22px;letter-spacing:-.02em}
.card2 .big.green{color:var(--green)} .card2 .big.violet{color:var(--violet)} .card2 .big.red{color:var(--red)} .card2 small{color:var(--ink-dim);font-size:12px}

ul.clean{list-style:none;padding:0;margin:6px 0;display:flex;flex-direction:column;gap:7px}
ul.clean li{padding-left:18px;position:relative;font-size:13.5px;color:var(--ink-dim)}
ul.clean li::before{content:"▸";position:absolute;left:0;color:var(--green)}
ul.clean li b,ul.clean li strong{color:var(--ink);font-weight:600}
ul.clean ul.clean,ul.clean ol.num{margin:6px 0 2px}
ol.num{padding-left:1.5em;margin:6px 0;display:flex;flex-direction:column;gap:6px}
ol.num li{font-size:13.5px;color:var(--ink-dim);padding-left:4px}
ol.num li::marker{color:var(--green);font-family:var(--f-mono);font-size:12px}
ol.num li b,ol.num li strong{color:var(--ink);font-weight:600}
.note{font-size:12.5px;color:var(--ink-dim);border-left:2px solid var(--line-bright);padding:4px 0 4px 13px;margin:10px 0}
.note b{color:var(--ink)}
.note p{margin:0 0 6px}.note p:last-child{margin:0}
.note.warn{border-left-color:var(--amber)} .note.warn b{color:var(--amber)}

/* ── diagrams / splits / flow (for optional hand-polish — paste HTML into the .md) ── */
.diagram{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:20px;margin:6px 0}
.sys{display:flex;align-items:stretch;gap:12px;flex-wrap:wrap}
.sys-col{display:flex;flex-direction:column;gap:10px;justify-content:center;flex:1;min-width:150px}
.sys-col.wide{flex:1.4}
.box{border:1px solid var(--line-bright);border-radius:8px;padding:11px 13px;background:var(--panel-2);font-size:12.5px}
.box .t{font-family:var(--f-mono);font-weight:700;color:var(--ink);font-size:12.5px}
.box small{display:block;color:var(--ink-faint);font-size:10.5px;margin-top:3px;font-family:var(--f-mono)}
.box.io{border-color:rgba(58,214,160,.4)} .box.io .t{color:var(--green)}
.box.store{border-color:var(--line-bright)} .box.store .t{color:var(--steel)}
.box.engine{border-color:rgba(176,140,240,.4)} .box.engine .t{color:var(--violet)}
.box.agent{border-color:rgba(176,140,240,.55);background:rgba(176,140,240,.07)} .box.agent .t{color:var(--violet)}
.box.head{background:transparent;border-style:dashed;color:var(--ink-faint)}
.sys-arrows{display:flex;flex-direction:column;justify-content:center;gap:14px;min-width:96px}
.awrap{display:flex;align-items:center;gap:6px;justify-content:center;color:var(--ink-faint)}
.alabel{font-family:var(--f-mono);font-size:9.5px;color:var(--green)}
.aglyph{font-size:17px;color:var(--line-bright)}
.sys-foot{margin-top:14px;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-faint);text-align:center;border-top:1px dashed var(--line);padding-top:11px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.col{border:1px solid var(--line);border-radius:10px;padding:15px;background:var(--panel)}
.col .ch{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;margin-bottom:11px;display:flex;align-items:center;gap:8px;text-transform:uppercase}
.col.det .ch{color:var(--steel)} .col.llm .ch{color:var(--violet)}
.col .ch .pill{font-size:9px;padding:2px 6px;border-radius:4px;border:1px solid currentColor}
.col ul.clean li::before{color:currentColor}
.col.det li::before{content:"≡";color:var(--steel)} .col.llm li::before{content:"✦";color:var(--violet)}
.col ul.clean li{color:var(--ink-dim)}
.gate{margin-top:13px;border:1px solid var(--amber);background:rgba(243,181,74,.07);border-radius:10px;padding:14px 16px;
  display:flex;gap:14px;align-items:center}
.gate .gt{font-family:var(--f-mono);font-weight:700;color:var(--amber);font-size:13px;white-space:nowrap}
.gate .gd{font-size:12.5px;color:var(--ink-dim)}

.flow{display:flex;flex-direction:column;align-items:stretch;gap:0;max-width:600px}
.node{border:1px solid var(--line-bright);border-left-width:3px;border-radius:8px;padding:11px 14px;background:var(--panel-2);
  display:flex;align-items:baseline;gap:12px}
.node .nm{font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--ink)}
.node .nd{font-size:12px;color:var(--ink-dim);margin-left:auto;text-align:right}
.node .ty{font-family:var(--f-mono);font-size:9.5px;padding:2px 6px;border-radius:4px;font-weight:700}
.node.data{border-left-color:var(--steel)} .node.data .ty{background:rgba(133,170,203,.16);color:var(--steel)}
.node.router{border-left-color:var(--amber)} .node.router .ty{background:rgba(243,181,74,.16);color:var(--amber)}
.node.agent{border-left-color:var(--violet);background:rgba(176,140,240,.06)} .node.agent .ty{background:rgba(176,140,240,.18);color:var(--violet)}
.node.opt{opacity:.72;border-style:dashed}
.arrow{align-self:center;color:var(--line-bright);font-size:15px;line-height:1;padding:3px 0}
.branch{align-self:flex-start;margin:2px 0 2px 26px;font-family:var(--f-mono);font-size:11px;color:var(--amber);display:flex;align-items:center;gap:8px}
.branch.retry{color:var(--violet)} .branch.fail{color:var(--red)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-family:var(--f-mono);font-size:11px;color:var(--ink-dim)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.pre{font-family:var(--f-mono);font-size:12px;line-height:1.65;color:var(--ink-dim);white-space:pre;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:6px 0;position:relative}
.pre .lang{position:absolute;top:8px;right:12px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.pre .g{color:var(--green)} .pre .v{color:var(--violet)} .pre .a{color:var(--amber)} .pre .d{color:var(--ink-faint)} .pre .s{color:var(--steel)} .pre .str{color:var(--green)} .pre .num{color:var(--amber)} .pre .com{color:var(--ink-faint);font-style:italic}

a.xref{color:var(--blue);border-bottom:1px dotted currentColor;text-decoration:none}
a.xref:hover{text-decoration:none;border-bottom-style:solid}

/* ── footer pager ────────────────────────────────────── */
.pager{border-top:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:space-between;
  padding:11px 22px;font-family:var(--f-mono);font-size:12px;color:var(--ink-dim)}
.pager button{all:unset;cursor:pointer;padding:6px 13px;border:1px solid var(--line-bright);border-radius:6px;transition:.14s;color:var(--ink-dim)}
.pager button:hover{border-color:var(--green);color:var(--ink)}
.pager button[disabled]{opacity:.3;cursor:default}
.pager .ctr{display:flex;gap:6px;align-items:center}
.pager .pos b{color:var(--green)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--green);color:#04130d;
  font-family:var(--f-mono);font-size:12px;font-weight:700;padding:10px 18px;border-radius:8px;opacity:0;transition:.25s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:860px){
  :root{--sidebar:100%}
  body{flex-direction:column}
  aside{position:static;height:auto;width:100%;flex-basis:auto}
  nav{flex-direction:row;flex-wrap:wrap;overflow:visible}
  .section{padding:30px 22px 80px}
  .split,.sys{grid-template-columns:1fr}
  .shead .idx{font-size:42px}
}
</style>
</head>

     • Escape any literal </script> inside the Markdown as <\/script>.

     The two example docs below are illustrative — replace them. -->
<script type="text/markdown" data-slug="example-a" data-title="Example A" data-sub="auto-rendered Markdown">
# Example A

A paragraph of intro prose becomes the section's one-line thesis when it leads a section.

## First topic

Body text renders as paragraphs. Inline `code`, **bold**, *italic*, and [links](https://example.com) all work.

- Bullet lists become the house style: **bold the term**, dim the rest.
- Wrap is automatic; nested items indent.
  - A nested bullet.

| field | status | note |
|---|---|---|
| `user_id` | keep | unchanged |
| `legacy`  | drop | removed in v2 |

> A blockquote becomes a side note.

## Second topic

```json
{ "card": "threshold", "dose": 40 }
```

### A sub-heading

Content under a `###` becomes its own commentable group, so a reader can annotate it.
</script>
<script type="text/markdown" data-slug="example-b" data-title="Example B" data-sub="a second related doc">
# Example B

When more than one doc is embedded, a **doc switcher** appears in the sidebar and each doc
keeps its own sections and comments. A link to [Example A](example-a.md) switches docs.

## Notes

Point the skill at one `.md` for a single-doc viewer, or several for this multi-doc shell.
</script>

<script>
/* ════════════════════════════════════════════════════════════════════
   md-render.js — dependency-free Markdown → blueprint-HTML renderer.
   Turns each embedded <script type="text/markdown"> into a doc model of
   sections, each section a list of commentable groups of styled blocks.
   Block-level raw HTML passes through untouched (for hand-polish).
   ════════════════════════════════════════════════════════════════════ */
window.MDV = (function(){
  "use strict";

  function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function slugify(s){return String(s).toLowerCase().replace(/`/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,48)||"sec";}

  var FILE2SLUG = {}; // 'db.md' -> slug, for cross-doc links

  // ---- inline markdown -> HTML ----
  function inline(text){
    var codes=[];
    text=text.replace(/`([^`]+)`/g,function(_,c){codes.push("<code>"+esc(c)+"</code>");return "␀"+(codes.length-1)+"␀";});
    text=esc(text);
    // images ![alt](src)
    text=text.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g,function(_,alt,src){return '<img alt="'+alt+'" src="'+src+'">';});
    // links [label](href)
    text=text.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g,function(_,label,href){
      var ref=href.charAt(0)==="#"?null:FILE2SLUG[href.split("#")[0].split("/").pop().toLowerCase()];
      if(ref){ return '<a class="xref" data-doc-ref="'+ref+'" href="#'+ref+'">'+label+'</a>'; }
      var ext=/^https?:/.test(href)?' target="_blank" rel="noopener"':'';
      return '<a href="'+href+'"'+ext+'>'+label+'</a>';
    });
    text=text.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
    text=text.replace(/(^|[^*])\*([^*\s][^*]*?)\*/g,"$1<em>$2</em>");
    text=text.replace(/~~([^~]+)~~/g,"<s>$1</s>");
    text=text.replace(/␀(\d+)␀/g,function(_,i){return codes[+i];});
    return text;
  }

  // ---- light, language-agnostic code coloring (safe: comments, strings, numbers) ----
  function highlight(code){
    var out=esc(code);
    out=out.replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;|"[^"\n]*"|'[^'\n]*')/g,'<span class="str">$1</span>');
    out=out.replace(/(^|\n)(\s*)((?:#|\/\/).*?)(?=\n|$)/g,'$1$2<span class="com">$3</span>');
    out=out.replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="num">$1</span>');
    return out;
  }

  // ---- raw block-HTML detection (passthrough for hand-polish) ----
  var BLOCK_HTML=/^<(\/)?(div|table|thead|tbody|tr|td|th|section|article|aside|figure|figcaption|pre|ul|ol|li|blockquote|p|h[1-6]|img|details|summary|hr|svg|span|small|b|strong|em|code)[\s>\/]/i;

  // parse a list region starting at i; returns {html,next}. Handles nesting by indent.
  function parseList(lines,i){
    function indentOf(l){var m=l.match(/^(\s*)/);return m[1].replace(/\t/g,"  ").length;}
    function isItem(l){return /^\s*([-*+]|\d+[.)])\s+/.test(l);}
    function build(minIndent){
      var ordered=/^\s*\d+[.)]\s+/.test(lines[i]);
      var cls=ordered?"ol":"ul", tag=ordered?"ol":"ul", listClass=ordered?"num":"clean";
      var html="<"+tag+' class="'+listClass+'">';
      while(i<lines.length){
        if(lines[i].trim()===""){ // blank: allow if next line is a deeper/same item, else stop
          if(i+1<lines.length&&isItem(lines[i+1])&&indentOf(lines[i+1])>=minIndent){i++;continue;}
          break;
        }
        if(!isItem(lines[i])||indentOf(lines[i])<minIndent)break;
        var ind=indentOf(lines[i]);
        var txt=lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/,"");
        i++;
        // gather wrapped continuation lines (more indented, not a new item)
        while(i<lines.length&&lines[i].trim()!==""&&!isItem(lines[i])&&indentOf(lines[i])>ind){txt+=" "+lines[i].trim();i++;}
        var inner=inline(txt);
        // nested sub-list?
        if(i<lines.length&&isItem(lines[i])&&indentOf(lines[i])>ind){ inner+=build(indentOf(lines[i])); }
        html+="<li>"+inner+"</li>";
      }
      html+="</"+tag+">";
      return html;
    }
    var startIndent=indentOf(lines[i]);
    var html=build(startIndent);
    return {html:html,next:i};
  }

  // render the blocks of one section's lines into an array of {label,anchorSlug,html}
  function renderGroups(lines,doc,secId,secTitle){
    var groups=[], cur=null;
    function open(label,slugHint){ cur={label:label,slug:slugHint,parts:[]}; groups.push(cur); }
    function ensure(){ if(!cur)open(secTitle||"Intro","intro"); }
    open(secTitle||"Intro","intro");
    var i=0;
    while(i<lines.length){
      var line=lines[i];
      // sub-heading -> new commentable group
      var hm=line.match(/^(#{3,6})\s+(.*)$/);
      if(hm){
        var lvl=hm[1].length, txt=hm[2].trim();
        var tag=lvl<=3?"h3":"h4";
        open(txt,slugify(txt));
        cur.parts.push("<"+tag+">"+inline(txt)+"</"+tag+">");
        i++; continue;
      }
      ensure();
      // raw block HTML passthrough
      if(BLOCK_HTML.test(line)){
        var buf=[];
        while(i<lines.length&&lines[i].trim()!==""){buf.push(lines[i]);i++;}
        cur.parts.push(buf.join("\n").replace(/<\\\/script>/g,"<\/script>"));
        continue;
      }
      // fenced code
      var fence=line.match(/^```(.*)$/);
      if(fence){
        var lang=fence[1].trim(); var cbuf=[]; i++;
        while(i<lines.length&&!/^```/.test(lines[i])){cbuf.push(lines[i]);i++;}
        i++;
        var langTag=lang?'<span class="lang">'+esc(lang)+'</span>':'';
        cur.parts.push('<div class="pre">'+langTag+highlight(cbuf.join("\n"))+'</div>');
        continue;
      }
      // hr
      if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)){cur.parts.push("<hr>");i++;continue;}
      // table
      if(/\|/.test(line)&&i+1<lines.length&&/^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(lines[i+1])&&/-/.test(lines[i+1])){
        var head=splitRow(line); i+=2; var rows=[];
        while(i<lines.length&&/\|/.test(lines[i])&&lines[i].trim()!==""){rows.push(splitRow(lines[i]));i++;}
        var t='<div class="tbl-scroll"><table><thead><tr>'+head.map(function(h){return "<th>"+inline(h)+"</th>";}).join("")+"</tr></thead><tbody>";
        rows.forEach(function(r){t+="<tr>"+r.map(function(c){return "<td>"+inline(c)+"</td>";}).join("")+"</tr>";});
        t+="</tbody></table></div>"; cur.parts.push(t); continue;
      }
      // blockquote
      if(/^\s*>\s?/.test(line)){
        var qbuf=[];
        while(i<lines.length&&/^\s*>\s?/.test(lines[i])){qbuf.push(lines[i].replace(/^\s*>\s?/,""));i++;}
        var qt=qbuf.join(" ").trim();
        var warn=/^(warn|warning|caution|watch|important|danger|note:)/i.test(qt)?" warn":"";
        cur.parts.push('<div class="note'+warn+'">'+inline(qt)+"</div>");
        continue;
      }
      // list
      if(/^\s*([-*+]|\d+[.)])\s+/.test(line)){
        var r=parseList(lines,i); cur.parts.push(r.html); i=r.next; continue;
      }
      // blank
      if(line.trim()===""){i++;continue;}
      // paragraph
      var pbuf=[line]; i++;
      while(i<lines.length&&lines[i].trim()!==""&&!/^(#{1,6})\s/.test(lines[i])&&!/^```/.test(lines[i])&&
            !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])&&!/^\s*>\s?/.test(lines[i])&&!BLOCK_HTML.test(lines[i])&&
            !/^\s*([-*_])(\s*\1){2,}\s*$/.test(lines[i])){pbuf.push(lines[i]);i++;}
      cur.parts.push("<p>"+inline(pbuf.join(" "))+"</p>");
    }
    return groups.filter(function(g){return g.parts.length;});
  }

  function splitRow(line){return line.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(function(c){return c.trim();});}

  // split a doc body into sections by # / ## ; first # is the doc title
  function parseDoc(slug,title,sub,md){
    md=md.replace(/\r\n/g,"\n").replace(/^﻿/,"");
    // strip leading YAML front matter
    md=md.replace(/^---\n[\s\S]*?\n---\n/,"");
    var lines=md.split("\n");
    var docTitle=title, sections=[], cur=null, titleSeen=false;
    function newSec(name){cur={name:name,lines:[]};sections.push(cur);}
    var i=0;
    while(i<lines.length){
      var h=lines[i].match(/^(#{1,2})\s+(.*)$/);
      if(h){
        var lvl=h[1].length, txt=h[2].trim().replace(/`/g,"");
        if(lvl===1&&!titleSeen){docTitle=title||txt;titleSeen=true;i++;continue;}
        newSec(txt); i++; continue;
      }
      if(!cur){ // content before first heading
        if(lines[i].trim()===""){i++;continue;}
        newSec("Overview");
      }
      cur.lines.push(lines[i]); i++;
    }
    // build section models
    var secModels=sections.map(function(s,idx){
      var id=slug+"--"+slugify(s.name)+"-"+idx;
      // pull a leading paragraph as the thesis (and drop it from the body)
      var thesis=null, body=s.lines.slice();
      var fl=0; while(fl<body.length&&body[fl].trim()==="")fl++;
      if(fl<body.length&&!/^(#{1,6}\s|[-*+]\s|\d+[.)]\s|>\s|```|\||<)/.test(body[fl])){
        var para=[body[fl]],k=fl+1;
        while(k<body.length&&body[k].trim()!==""&&!/^(#{1,6}\s|[-*+]\s|\d+[.)]\s|>\s|```|\||<)/.test(body[k])){para.push(body[k]);k++;}
        var ptxt=para.join(" ").trim();
        if(ptxt.length<=240){thesis=inline(ptxt);body=body.slice(0,fl).concat(body.slice(k));}
      }
      var groups=renderGroups(body,slug,id,s.name);
      return {id:id,name:s.name,idx:idx,thesis:thesis,groups:groups};
    });
    return {slug:slug,title:docTitle,sub:sub,sections:secModels};
  }

  function parseAll(){
    var nodes=[].slice.call(document.querySelectorAll('script[type="text/markdown"]'));
    nodes.forEach(function(n){
      var slug=n.getAttribute("data-slug")||slugify(n.getAttribute("data-title")||"doc");
      FILE2SLUG[(slug+".md").toLowerCase()]=slug;
      FILE2SLUG[(slug+".html").toLowerCase()]=slug;
      // optional: original source filename(s) so cross-doc links in the Markdown resolve.
      // data-file="E01-foundation.md" (or a comma/space list of names/aliases)
      var files=n.getAttribute("data-file")||"";
      files.split(/[,\s]+/).forEach(function(f){
        f=f.trim().toLowerCase(); if(!f)return;
        FILE2SLUG[f]=slug;
        FILE2SLUG[f.replace(/\.md$/,".html")]=slug;
      });
    });
    return nodes.map(function(n){
      var slug=n.getAttribute("data-slug")||slugify(n.getAttribute("data-title")||"doc");
      var raw=n.textContent.replace(/^\n/,"").replace(/<\\\/script>/g,"<\/script>");
      return parseDoc(slug,n.getAttribute("data-title")||slug,n.getAttribute("data-sub")||"",raw);
    });
  }

  return {parseAll:parseAll};
})();
</script>

<script>
/* ════════════════════════════════════════════════════════════════════
   viewer.js — builds the DOM from the parsed docs, runs the sidebar,
   pagination, theming, keyboard shortcuts, and the comment harness.
   Config comes from <body data-*>. Multi-doc aware. No per-doc edits.
   ════════════════════════════════════════════════════════════════════ */
(function(){
  "use strict";
  var body=document.body;
  var STORE=body.dataset.store||"mdv-comments-v1";
  var DOC=body.dataset.doc||"doc";
  var EXPORT_TITLE=body.dataset.exportTitle||"Review comments";
  var scroll=document.getElementById("scroll");
  var nav=document.getElementById("nav");
  var docsBar=document.getElementById("docs");

  var DOCS=window.MDV.parseAll();
  if(!DOCS.length){scroll.innerHTML='<div class="section active"><p>No documents embedded.</p></div>';return;}

  // ---- render every doc's sections into the DOM (hidden); collect refs ----
  function groupHTML(g,id){
    var anchor=id+"-"+(g.slug||"g");
    return '<div class="commentable" data-anchor="'+anchor+'" data-label="'+escAttr(g.label||"")+'">'+g.parts.join("\n")+"</div>";
  }
  function escAttr(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}
  function sectionHTML(doc,sec){
    var kick=DOCS.length>1?escAttr(doc.title):"";
    var seen={};
    var groups=sec.groups.map(function(g){
      var base=g.slug||"g"; var s=base, n=1; while(seen[s]){s=base+"-"+(++n);} seen[s]=1; g.slug=s;
      return groupHTML(g,sec.id);
    }).join("\n");
    return '<section class="section" data-doc="'+doc.slug+'" data-name="'+escAttr(sec.name)+'" id="'+sec.id+'">'
      +'<div class="shead"><div class="idx">'+String(sec.idx).padStart(2,"0")+'</div><div class="meta">'
      +(kick?'<div class="kick">'+kick+'</div>':'')
      +'<h2>'+inlineSafe(sec.name)+'</h2>'+(sec.thesis?'<p>'+sec.thesis+'</p>':'')
      +'</div></div>'+groups+'</section>';
  }
  function inlineSafe(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}

  var html="";
  DOCS.forEach(function(doc){ doc.sections.forEach(function(sec){ html+=sectionHTML(doc,sec); }); });
  scroll.innerHTML=html;

  // index sections by doc
  DOCS.forEach(function(doc){
    doc.secEls=[].slice.call(scroll.querySelectorAll('.section[data-doc="'+doc.slug+'"]'));
  });

  // ---- storage ----
  function load(){try{return JSON.parse(localStorage.getItem(STORE))||{};}catch(e){return {};}}
  function persist(d){localStorage.setItem(STORE,JSON.stringify(d));}
  var data=load();
  function uid(){return "n"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
  function secOf(el){var s=el.closest(".section");return s?s.getAttribute("data-name"):"";}
  function docOf(el){var s=el.closest(".section");return s?s.getAttribute("data-doc"):"";}

  var curDoc=0, cur=0, navBtns=[];

  // ---- doc switcher ----
  function buildDocsBar(){
    if(DOCS.length<2){docsBar.classList.remove("show");return;}
    docsBar.classList.add("show");
    var nl=document.getElementById("navlabel"); if(nl)nl.classList.add("show");
    DOCS.forEach(function(doc,di){
      var b=document.createElement("button"); b.className="docbtn"; b.dataset.doc=String(di);
      b.innerHTML='<span class="dn">'+String(di+1).padStart(2,"0")+'</span><span class="dt">'+inlineSafe(doc.title)+'</span><span class="dcc"></span>';
      b.addEventListener("click",function(){selectDoc(di,true);});
      docsBar.appendChild(b);
    });
  }
  function docBtns(){return [].slice.call(docsBar.querySelectorAll(".docbtn"));}

  // ---- nav for the active doc ----
  function buildNav(){
    nav.innerHTML="";
    var doc=DOCS[curDoc];
    doc.secEls.forEach(function(s,i){
      var b=document.createElement("button");
      b.innerHTML='<span class="n">'+String(i).padStart(2,"0")+'</span><span class="t">'+s.getAttribute("data-name")+'</span><span class="cc" data-sec="'+escAttr(s.getAttribute("data-name"))+'"></span>';
      b.addEventListener("click",function(){go(i);});
      nav.appendChild(b);
    });
    navBtns=[].slice.call(nav.children);
    document.getElementById("posTot").textContent=doc.secEls.length;
  }

  function selectDoc(di,user){
    if(DOCS[curDoc]&&DOCS[curDoc].secEls[cur])DOCS[curDoc].secEls[cur].classList.remove("active");
    curDoc=di;
    docBtns().forEach(function(b,bi){b.classList.toggle("active",bi===di);});
    buildNav();
    var start=0;
    var ls=parseInt(localStorage.getItem(STORE+"-last-"+DOCS[di].slug),10);
    if(!isNaN(ls)&&ls<DOCS[di].secEls.length)start=ls;
    go(start);
    renderBadges();
    if(user)localStorage.setItem(STORE+"-activedoc",DOCS[di].slug);
  }

  function go(i){
    var doc=DOCS[curDoc];
    i=Math.max(0,Math.min(doc.secEls.length-1,i));
    doc.secEls.forEach(function(s){s.classList.remove("active");});
    navBtns.forEach(function(b){b.classList.remove("active");});
    cur=i;
    doc.secEls[i].classList.add("active");
    if(navBtns[i])navBtns[i].classList.add("active");
    document.getElementById("posNow").textContent=i+1;
    document.getElementById("prev").disabled=(i===0);
    document.getElementById("next").disabled=(i===doc.secEls.length-1);
    scroll.scrollTop=0;
    var id=doc.secEls[i].id;
    if(location.hash!=="#"+id)history.replaceState(null,"","#"+id);
    localStorage.setItem(STORE+"-last-"+doc.slug,String(i));
  }
  document.getElementById("prev").addEventListener("click",function(){go(cur-1);});
  document.getElementById("next").addEventListener("click",function(){go(cur+1);});
  document.addEventListener("keydown",function(e){
    var tag=e.target.tagName;
    if(tag==="TEXTAREA"||tag==="INPUT"||e.target.isContentEditable)return;
    if(e.metaKey||e.ctrlKey||e.altKey)return;
    if(e.key==="ArrowRight"||e.key==="]")go(cur+1);
    else if(e.key==="ArrowLeft"||e.key==="[")go(cur-1);
    else if(e.key==="t"||e.key==="T")cycleTheme();
    else if(e.key==="c"||e.key==="C")setComments(!on);
  });

  // ---- cross-doc links ----
  scroll.addEventListener("click",function(e){
    var a=e.target.closest("a.xref"); if(!a)return;
    var ref=a.getAttribute("data-doc-ref"); if(!ref)return;
    var di=DOCS.findIndex(function(d){return d.slug===ref;});
    if(di>=0){e.preventDefault();selectDoc(di,true);}
  });

  // ---- comments ----
  var commentables=[].slice.call(scroll.querySelectorAll(".commentable"));
  function totalCount(){var n=0;for(var k in data){if(data[k]&&data[k].notes)n+=data[k].notes.length;}return n;}
  function countForDocSec(slug,sec){var n=0;for(var k in data){var r=data[k];if(r&&r.doc===slug&&r.section===sec&&r.notes)n+=r.notes.length;}return n;}
  function countForDoc(slug){var n=0;for(var k in data){var r=data[k];if(r&&r.doc===slug&&r.notes)n+=r.notes.length;}return n;}

  function renderBadges(){
    document.getElementById("totCt").textContent=totalCount();
    var doc=DOCS[curDoc];
    navBtns.forEach(function(b){
      var cc=b.querySelector(".cc"); var sec=cc.getAttribute("data-sec"); var c=countForDocSec(doc.slug,sec);
      cc.textContent=c; cc.classList.toggle("show",c>0);
    });
    docBtns().forEach(function(b,bi){
      var dcc=b.querySelector(".dcc"); var c=countForDoc(DOCS[bi].slug);
      dcc.textContent=c; dcc.classList.toggle("show",c>0);
    });
  }

  function renderZone(block){
    var anchor=block.getAttribute("data-anchor");
    var rec=data[anchor];
    var old=block.querySelector(".cmt-zone"); if(old)old.remove();
    var hasNotes=rec&&rec.notes&&rec.notes.length;
    block.classList.toggle("has-notes",!!hasNotes);
    var bdg=block.querySelector(".cmt-badge"); if(bdg)bdg.textContent=hasNotes?rec.notes.length:"";
    if(!hasNotes)return;
    var zone=document.createElement("div"); zone.className="cmt-zone";
    rec.notes.forEach(function(note){
      var d=document.createElement("div"); d.className="cmt-note";
      var t=new Date(note.ts);
      var tm=t.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" "+t.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
      d.innerHTML='<span class="tx"></span><span class="tm">'+tm+'</span><button class="del" title="delete">✕</button>';
      d.querySelector(".tx").textContent=note.text;
      d.querySelector(".del").addEventListener("click",function(){
        rec.notes=rec.notes.filter(function(x){return x.id!==note.id;});
        if(!rec.notes.length)delete data[anchor];
        persist(data); renderZone(block); renderBadges();
      });
      zone.appendChild(d);
    });
    block.appendChild(zone);
  }

  function openEditor(block){
    if(block.querySelector(".cmt-edit"))return;
    var anchor=block.getAttribute("data-anchor");
    var ed=document.createElement("div"); ed.className="cmt-edit";
    ed.innerHTML='<textarea placeholder="Comment on: '+escAttr(block.getAttribute("data-label")||anchor)+'"></textarea>'+
      '<div class="ebtns"><button class="cancel">cancel</button><button class="save">save note</button></div>';
    block.appendChild(ed);
    var ta=ed.querySelector("textarea"); ta.focus();
    function close(){ed.remove();}
    ed.querySelector(".cancel").addEventListener("click",close);
    ta.addEventListener("keydown",function(e){if((e.metaKey||e.ctrlKey)&&e.key==="Enter")save();if(e.key==="Escape")close();});
    ed.querySelector(".save").addEventListener("click",save);
    function save(){
      var v=ta.value.trim(); if(!v){close();return;}
      if(!data[anchor])data[anchor]={doc:docOf(block),section:secOf(block),label:block.getAttribute("data-label")||anchor,notes:[]};
      data[anchor].notes.push({id:uid(),text:v,ts:new Date().toISOString()});
      persist(data); close(); renderZone(block); renderBadges();
    }
  }

  commentables.forEach(function(block){
    var add=document.createElement("button"); add.className="cmt-add"; add.textContent="＋ note";
    add.addEventListener("click",function(e){e.stopPropagation();openEditor(block);});
    block.insertBefore(add,block.firstChild);
    var badge=document.createElement("span"); badge.className="cmt-badge";
    block.insertBefore(badge,block.firstChild);
    renderZone(block);
  });

  // ---- comment mode toggle ----
  var on=false, tgl=document.getElementById("cmtToggle");
  function setComments(v){
    on=v; document.body.classList.toggle("comments-on",on);
    tgl.classList.toggle("on",on); document.getElementById("cmStat").textContent=on?"on":"off";
  }
  tgl.addEventListener("click",function(){setComments(!on);});

  // ---- theme ----
  var THEME_KEY="md-viewer-theme";
  var segBtns=[].slice.call(document.querySelectorAll("#themeSeg button"));
  var mq=window.matchMedia("(prefers-color-scheme: light)");
  function themePref(){try{return localStorage.getItem(THEME_KEY)||"system";}catch(e){return "system";}}
  function applyTheme(pref){
    var eff=pref==="system"?(mq.matches?"light":"dark"):pref;
    document.documentElement.setAttribute("data-theme",eff);
    segBtns.forEach(function(b){b.classList.toggle("on",b.getAttribute("data-theme-choice")===pref);});
  }
  function setTheme(pref){try{localStorage.setItem(THEME_KEY,pref);}catch(e){}applyTheme(pref);}
  function cycleTheme(){var o=["light","dark","system"];setTheme(o[(o.indexOf(themePref())+1)%o.length]);}
  segBtns.forEach(function(b){b.addEventListener("click",function(){setTheme(b.getAttribute("data-theme-choice"));});});
  if(mq.addEventListener)mq.addEventListener("change",function(){if(themePref()==="system")applyTheme("system");});
  else if(mq.addListener)mq.addListener(function(){if(themePref()==="system")applyTheme("system");});
  applyTheme(themePref());
  window.addEventListener("message",function(e){
    var d=e.data; if(d&&d.type==="mdv-theme"&&(d.theme==="light"||d.theme==="dark")){
      document.documentElement.setAttribute("data-theme",d.theme);
      segBtns.forEach(function(b){b.classList.toggle("on",b.getAttribute("data-theme-choice")===d.theme);});
    }
  });

  // ---- export ----
  function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},1900);}
  function download(name,text,type){
    var blob=new Blob([text],{type:type});var u=URL.createObjectURL(blob);
    var a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();
    a.remove();setTimeout(function(){URL.revokeObjectURL(u);},1000);
  }
  function docTitleOf(slug){for(var i=0;i<DOCS.length;i++)if(DOCS[i].slug===slug)return DOCS[i].title;return slug;}
  function payload(){
    var out={exportedAt:new Date().toISOString(),total:totalCount(),comments:[]};
    var order={}; commentables.forEach(function(b,i){order[b.getAttribute("data-anchor")]=i;});
    Object.keys(data).sort(function(a,b){return (order[a]||0)-(order[b]||0);}).forEach(function(k){
      var r=data[k]; if(!r||!r.notes||!r.notes.length)return;
      out.comments.push({anchor:k,doc:r.doc,docTitle:docTitleOf(r.doc),section:r.section,block:r.label,notes:r.notes.map(function(n){return {text:n.text,ts:n.ts};})});
    });
    return out;
  }
  function toMarkdown(){
    var p=payload();
    var s="# "+EXPORT_TITLE+"\n\n_Exported "+p.exportedAt+" · "+p.total+" comment(s)_\n";
    var curDocSlug=null,curSec=null;
    p.comments.forEach(function(c){
      if(c.doc!==curDocSlug){curDocSlug=c.doc;curSec=null;s+="\n## "+c.docTitle+" (`"+c.doc+"`)\n";}
      if(c.section!==curSec){curSec=c.section;s+="\n### "+curSec+"\n";}
      s+="\n**"+c.block+"**  \n`#"+c.anchor+"`\n";
      c.notes.forEach(function(n){s+="\n- "+n.text.replace(/\n/g,"\n  ")+"  \n  _"+n.ts+"_\n";});
    });
    if(!p.comments.length)s+="\n_No comments yet._\n";
    return s;
  }
  document.getElementById("expJson").addEventListener("click",function(){
    if(!totalCount())return toast("No comments to export");
    download(DOC+"-comments.json",JSON.stringify(payload(),null,2),"application/json");toast("Saved "+DOC+"-comments.json");
  });
  document.getElementById("expMd").addEventListener("click",function(){
    if(!totalCount())return toast("No comments to export");
    download(DOC+"-comments.md",toMarkdown(),"text/markdown");toast("Saved "+DOC+"-comments.md");
  });
  document.getElementById("copyMd").addEventListener("click",function(){
    if(!totalCount())return toast("No comments to copy");
    navigator.clipboard.writeText(toMarkdown()).then(function(){toast("Copied as Markdown");},function(){toast("Copy failed");});
  });
  document.getElementById("clearAll").addEventListener("click",function(){
    if(!totalCount())return;
    if(!confirm("Delete all "+totalCount()+" comment(s)? This cannot be undone."))return;
    data={};persist(data);commentables.forEach(renderZone);renderBadges();toast("All comments cleared");
  });

  // ---- init ----
  buildDocsBar();
  // resolve initial doc + section from hash, else last active doc
  var startDoc=0;
  if(location.hash){
    for(var di=0;di<DOCS.length;di++){ if(DOCS[di].secEls.some(function(s){return "#"+s.id===location.hash;})){startDoc=di;break;} }
  } else {
    var ad=localStorage.getItem(STORE+"-activedoc");
    if(ad){var k=DOCS.findIndex(function(d){return d.slug===ad;});if(k>=0)startDoc=k;}
  }
  curDoc=startDoc;
  docBtns().forEach(function(b,bi){b.classList.toggle("active",bi===startDoc);});
  buildNav();
  var startSec=0;
  if(location.hash){var idx=DOCS[startDoc].secEls.findIndex(function(s){return "#"+s.id===location.hash;});if(idx>=0)startSec=idx;}
  else{var ls=parseInt(localStorage.getItem(STORE+"-last-"+DOCS[startDoc].slug),10);if(!isNaN(ls)&&ls<DOCS[startDoc].secEls.length)startSec=ls;}
  go(startSec);
  renderBadges();
})();
</script>
</body>
</html>
